<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ArulzXD REST API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #FAF7EF; font-family: 'Plus Jakarta Sans', sans-serif; }
        .brutal-border { border: 2.5px solid #121212; }
    </style>
</head>
<body class="p-4 sm:p-8 max-w-6xl mx-auto text-zinc-900">

    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b-2 brutal-border mb-6">
        <div>
            <h1 class="text-2xl font-black uppercase">ADMIN DASHBOARD TRANSAKSI</h1>
            <p class="text-xs font-bold text-zinc-600">Verifikasi bukti pembayaran & upgrade role otomatis pengguna.</p>
        </div>
        <button id="btnEnableNotif" onclick="enableChromeNotification()" class="bg-blue-500 text-white font-black px-4 py-2.5 rounded-xl border-2 brutal-border text-xs uppercase tracking-wider shadow-sm active:scale-95">
            <i class="fa-solid fa-bell mr-1.5"></i> AK TIFKAN NOTIFIKASI CHROME
        </button>
    </header>

    <main>
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-black uppercase">Daftar Transaksi Masuk</h2>
            <button onclick="loadTransactions()" class="bg-yellow-300 font-black text-xs px-3 py-1.5 rounded-lg border-2 brutal-border active:scale-95">
                <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
            </button>
        </div>

        <div id="transactionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 font-mono font-bold text-zinc-500">Memuat transaksi...</div>
        </div>
    </main>

    <script>
        // 1. Register Service Worker untuk Notifikasi Android System
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ Service Worker Aktif Scope:', reg.scope))
                .catch(err => console.error('❌ Gagal register SW:', err));
        }

        // 2. Fungsi Suara Alarm (Synthesizer Audio Beep saat Trx Masuk)
        function playAlarmSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // High pitch note (A5)
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch (e) {
                console.warn("Audio Context blocked:", e);
            }
        }

        function enableChromeNotification() {
            if (!("Notification" in window)) {
                Swal.fire("Error", "Browser ini tidak mendukung notifikasi Chrome.", "error");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    playAlarmSound();
                    Swal.fire("Sip!", "Notifikasi Chrome & Suara Alarm telah aktif!", "success");
                    updateNotifButtonState();
                } else {
                    Swal.fire("Izin Ditolak", "Silakan izinkan notifikasi di setelan browser Chrome HP Anda.", "warning");
                }
            });
        }

        function updateNotifButtonState() {
            const btn = document.getElementById('btnEnableNotif');
            if (btn && Notification.permission === "granted") {
                btn.classList.remove('bg-blue-500');
                btn.classList.add('bg-emerald-500');
                btn.innerHTML = '<i class="fa-solid fa-bell mr-1.5"></i> NOTIFIKASI CHROME AKTIF';
            }
        }

        // 3. Trigger Notifikasi Chrome Status Bar & Quick Modal
        async function triggerChromeNotification(data) {
            playAlarmSound();

            const title = "🔔 BUKTI TRANSAKSI BARU!";
            const options = {
                body: `Order: ${data.orderId}\nUser: ${data.username}\nTotal: Rp ${(data.amount || 0).toLocaleString('id-ID')}\nPaket: ${data.item || '-'}`,
                icon: "https://cdn.arulzzxd.my.id/files/Q2C70y.png",
                badge: "https://cdn.arulzzxd.my.id/files/Q2C70y.png",
                vibrate: [500, 150, 500, 150, 500],
                tag: "trx-" + data.orderId,
                renotify: true,
                requireInteraction: true,
                ongoing: true,
                data: { orderId: data.orderId },
                actions: [
                    { action: 'approve', title: '⚡ KONFIRMASI LUNAS' }
                ]
            };

            // Kirim Notifikasi via Service Worker (Muncul di Bar HP)
            if (Notification.permission === "granted" && 'serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    await reg.showNotification(title, options);
                } catch (e) {
                    console.warn("SW notification error:", e);
                    new Notification(title, options);
                }
            }

            // Tampilkan Modal Popup Langsung di Layar Dashboard untuk Fast-Action
            Swal.fire({
                title: '⚡ BUKTI TRANSAKSI BARU!',
                html: `
                    <div class="text-left font-bold text-xs space-y-1.5 bg-amber-50 p-3 rounded-xl border-2 brutal-border mt-2">
                        <p><span class="text-zinc-500">Order ID:</span> <span class="font-mono text-black">${data.orderId}</span></p>
                        <p><span class="text-zinc-500">Pengguna:</span> ${data.username}</p>
                        <p><span class="text-zinc-500">Total Rp:</span> <strong class="text-emerald-700 font-mono">Rp ${(data.amount || 0).toLocaleString('id-ID')}</strong></p>
                        <p><span class="text-zinc-500">Paket:</span> ${data.item || '-'}</p>
                    </div>
                `,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '⚡ LUNASKAN SEKARANG',
                cancelButtonText: 'Tutup',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#6b7280',
                customClass: { popup: 'brutal-border rounded-2xl' }
            }).then((result) => {
                if (result.isConfirmed) {
                    approveTransaction(data.orderId);
                }
            });
        }

        // Preview Bukti Transfer Tanpa about:blank
        function viewProofImage(imageUrl) {
            Swal.fire({
                title: 'Bukti Transfer',
                imageUrl: imageUrl,
                imageAlt: 'Gambar Bukti Pembayaran',
                showCloseButton: true,
                showConfirmButton: false,
                background: '#FFFDF8',
                customClass: { popup: 'brutal-border rounded-2xl' }
            });
        }

        async function loadTransactions() {
            try {
                const res = await fetch('/api/admin/transactions');
                const result = await res.json();
                const grid = document.getElementById('transactionGrid');

                if (!result.data || result.data.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 font-bold text-zinc-500">Belum ada transaksi.</div>`;
                    return;
                }

                grid.innerHTML = result.data.map(trx => {
                    const statusColor = trx.status === 'success' ? 'bg-emerald-300' : trx.status === 'waiting_confirmation' ? 'bg-amber-300 animate-pulse' : 'bg-zinc-200';
                    return `
                        <div class="bg-white border-2 brutal-border p-4 rounded-2xl shadow-xs flex flex-col justify-between space-y-3">
                            <div>
                                <div class="flex items-center justify-between border-b-2 border-zinc-200 pb-2 mb-2">
                                    <span class="font-mono font-black text-xs">${trx.orderId}</span>
                                    <span class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase border-2 brutal-border ${statusColor}">${trx.status}</span>
                                </div>
                                <div class="text-xs space-y-1 font-bold">
                                    <p><span class="text-zinc-500">User:</span> ${trx.username} (${trx.email})</p>
                                    <p><span class="text-zinc-500">Total:</span> <strong class="text-emerald-700 font-mono">Rp ${trx.amount.toLocaleString('id-ID')}</strong></p>
                                    <p><span class="text-zinc-500">Paket:</span> ${trx.itemDetails?.nama || '-'}</p>
                                </div>

                                ${trx.proofImage ? `
                                    <div class="mt-3">
                                        <p class="text-[10px] font-black uppercase text-zinc-500 mb-1">Bukti Transfer (Klik untuk Perbesar):</p>
                                        <img src="${trx.proofImage}" onclick="viewProofImage('${trx.proofImage}')" class="max-h-40 w-full object-cover rounded-lg border-2 brutal-border cursor-pointer hover:opacity-80 transition-opacity">
                                    </div>
                                ` : `<p class="text-[10px] font-bold text-red-500 mt-2">Belum mengunggah bukti.</p>`}
                            </div>

                            ${trx.status === 'waiting_confirmation' || trx.status === 'pending' ? `
                                <div class="flex gap-2 pt-2 border-t-2 border-zinc-200">
                                    <button onclick="approveTransaction('${trx.orderId}')" class="flex-1 bg-emerald-400 font-black text-xs py-2 rounded-xl border-2 brutal-border uppercase active:scale-95">LUNAS</button>
                                    <button onclick="rejectTransaction('${trx.orderId}')" class="flex-1 bg-red-400 font-black text-xs py-2 rounded-xl border-2 brutal-border uppercase active:scale-95">TOLAK</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Gagal memuat transaksi:", err);
            }
        }

        async function approveTransaction(orderId) {
            const res = await fetch(`/api/admin/transactions/${orderId}/approve`, { method: 'POST' });
            const data = await res.json();
            Swal.fire("Sukses", data.message, "success");
            loadTransactions();
        }

        async function rejectTransaction(orderId) {
            const res = await fetch(`/api/admin/transactions/${orderId}/reject`, { method: 'POST' });
            const data = await res.json();
            Swal.fire("Tersimpan", data.message, "info");
            loadTransactions();
        }

        // Auto-Reconnect EventSource SSE
        let evtSource;
        function connectAdminSSE() {
            evtSource = new EventSource("/api/admin/events");

            evtSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === "NEW_PAYMENT_PROOF") {
                    triggerChromeNotification(data);
                    loadTransactions();
                }
            };

            evtSource.onerror = function() {
                console.warn("⚠️ SSE Terputus. Menghubungkan kembali dalam 3 detik...");
                evtSource.close();
                setTimeout(connectAdminSSE, 3000);
            };
        }

        window.onload = function() {
            updateNotifButtonState();
            loadTransactions();
            connectAdminSSE();
        };
    </script>
</body>
</html>
