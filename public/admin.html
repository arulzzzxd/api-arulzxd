<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ArulzXD REST API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #FAF7EF; font-family: 'Plus Jakarta Sans', sans-serif; }
        .brutal-border { border: 2.5px solid #121212; }
    </style>
</head>
<body class="p-4 sm:p-8 max-w-6xl mx-auto text-zinc-900">

    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b-2 brutal-border mb-6">
        <div>
            <h1 class="text-2xl font-black uppercase">ADMIN DASHBOARD TRANSAKSI</h1>
            <p class="text-xs font-bold text-zinc-600">Verifikasi bukti pembayaran & upgrade role otomatis pengguna (Khusus: haqqi.official13@gmail.com).</p>
        </div>
        <div class="flex flex-wrap gap-2">
            <button id="btnEnableNotif" onclick="enableChromeNotification()" class="bg-blue-500 text-white font-black px-4 py-2.5 rounded-xl border-2 brutal-border text-xs uppercase tracking-wider shadow-sm active:scale-95">
                <i class="fa-solid fa-bell mr-1.5"></i> AKTIFKAN NOTIFIKASI
            </button>
            <button onclick="testNotification()" class="bg-purple-500 text-white font-black px-3 py-2.5 rounded-xl border-2 brutal-border text-xs uppercase active:scale-95">
                <i class="fa-solid fa-vial mr-1"></i> TES NOTIF & SUARA
            </button>
        </div>
    </header>

    <main>
        <!-- FILTER BAR TRANSAKSI -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex flex-wrap items-center gap-1.5">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn bg-zinc-900 text-white font-black text-xs px-3.5 py-1.5 rounded-lg border-2 brutal-border active:scale-95 transition-all">
                    Semua
                </button>
                <button onclick="setFilter('success')" id="filter-success" class="filter-btn bg-white text-zinc-900 font-black text-xs px-3.5 py-1.5 rounded-lg border-2 brutal-border active:scale-95 transition-all">
                    Success
                </button>
                <button onclick="setFilter('waiting')" id="filter-waiting" class="filter-btn bg-white text-zinc-900 font-black text-xs px-3.5 py-1.5 rounded-lg border-2 brutal-border active:scale-95 transition-all">
                    Pending
                </button>
                <button onclick="setFilter('reject')" id="filter-reject" class="filter-btn bg-white text-zinc-900 font-black text-xs px-3.5 py-1.5 rounded-lg border-2 brutal-border active:scale-95 transition-all">
                    Reject / Cancel
                </button>
            </div>

            <button onclick="loadTransactions()" class="bg-yellow-300 font-black text-xs px-3 py-1.5 rounded-lg border-2 brutal-border active:scale-95">
                <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
            </button>
        </div>

        <div id="transactionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 font-mono font-bold text-zinc-500">Memuat transaksi...</div>
        </div>
    </main>

    <script>
        let allTransactions = [];
        let currentFilter = 'all';
        let knownProofOrders = new Set();
        let audioUnlocked = false;
        let audioCtx = null;

        function unlockAudio() {
            if (!audioUnlocked) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                audioUnlocked = true;
                console.log("🔊 Audio Context Unlocked!");
            }
        }
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });

        async function registerSW() {
            if ('serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    await navigator.serviceWorker.ready;
                    return reg;
                } catch (err) {
                    console.error('❌ Gagal Register SW:', err);
                }
            }
            return null;
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        function playAlarmSound() {
            try {
                const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch (e) {
                console.warn("Audio diblokir browser:", e);
            }
        }

        async function syncPushSubscription() {
    if (!("Notification" in window) || !('serviceWorker' in navigator)) return;
    if (Notification.permission !== "granted") return;

    try {
        const reg = await registerSW();
        if (!reg) return;

        const keyRes = await fetch('/api/admin/vapid-public-key');
        if (!keyRes.ok) return;
        const { publicKey } = await keyRes.json();
        if (!publicKey) return;

        const applicationServerKey = urlBase64ToUint8Array(publicKey);
        let subscription = await reg.pushManager.getSubscription();

        if (!subscription) {
            subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: applicationServerKey
            });
        }

        await fetch('/api/admin/subscribe-push', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(subscription)
        });

        updateNotifButtonState();
    } catch (err) {
        console.error("Gagal sync push subscription:", err);
    }
}

        async function enableChromeNotification() {
            unlockAudio();
            if (!("Notification" in window) || !('serviceWorker' in navigator)) {
                Swal.fire("Error", "Browser ini tidak mendukung Web Push Notification.", "error");
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                playAlarmSound();
                await syncPushSubscription();
                Swal.fire("Sip!", "Notifikasi latar belakang (Web Push) telah aktif!", "success");
            } else {
                Swal.fire("Izin Ditolak", "Izinkan notifikasi di setelan browser Chrome HP Anda.", "warning");
            }
        }

        function updateNotifButtonState() {
            const btn = document.getElementById('btnEnableNotif');
            if (btn && Notification.permission === "granted") {
                btn.classList.remove('bg-blue-500');
                btn.classList.add('bg-emerald-500');
                btn.innerHTML = '<i class="fa-solid fa-bell mr-1.5"></i> NOTIFIKASI AKTIF';
            }
        }

        async function testNotification() {
    unlockAudio();
    try {
        const res = await fetch('/api/admin/test-push', { method: 'POST' });
        const data = await res.json();
        if (data.status) {
            Swal.fire("Sip!", "Notifikasi Web Push tes telah dikirim oleh server!", "success");
        } else {
            Swal.fire("Gagal", data.message || "Gagal mengirim notifikasi push.", "error");
        }
    } catch (err) {
        Swal.fire("Error", "Gagal menghubungi server untuk tes push notification.", "error");
    }
}

        function setFilter(filterType) {
            currentFilter = filterType;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-zinc-900', 'text-white');
                btn.classList.add('bg-white', 'text-zinc-900');
            });

            const activeBtn = document.getElementById(`filter-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-zinc-900');
                activeBtn.classList.add('bg-zinc-900', 'text-white');
            }

            renderTransactions();
        }

        function viewProofImage(imageUrl) {
            Swal.fire({
                title: 'Bukti Transfer',
                imageUrl: imageUrl,
                imageAlt: 'Bukti Pembayaran',
                showCloseButton: true,
                showConfirmButton: false,
                background: '#FFFDF8',
                customClass: { popup: 'brutal-border rounded-2xl' }
            });
        }

        async function triggerChromeNotification(data) {
            playAlarmSound();

            const durationDays = data.qty || data.itemDetails?.qty || 1;
            const title = "🔔 BUKTI TRANSAKSI BARU!";
            const options = {
                body: `Order: ${data.orderId}\nUser: ${data.username}\nTotal: Rp ${(data.amount || 0).toLocaleString('id-ID')}\nPaket: ${data.item || '-'}\nDurasi: ${durationDays} Hari`,
                vibrate: [400, 100, 400, 100, 400],
                tag: "trx-" + data.orderId,
                renotify: true,
                requireInteraction: true,
                data: { orderId: data.orderId },
                actions: [
                    { action: 'approve', title: '⚡ KONFIRMASI LUNAS' }
                ]
            };

            if (Notification.permission === "granted") {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    if (reg) {
                        await reg.showNotification(title, options);
                    } else {
                        new Notification(title, options);
                    }
                } catch (e) {
                    try { new Notification(title, options); } catch(err){}
                }
            }

            Swal.fire({
                title: '⚡ BUKTI TRANSAKSI BARU!',
                html: `
                    <div class="text-left font-bold text-xs space-y-1.5 bg-amber-50 p-3 rounded-xl border-2 brutal-border mt-2">
                        <p class="flex items-center gap-2"><i class="fa-solid fa-hashtag text-zinc-500 w-4"></i><span>Order ID:</span> <span class="font-mono text-black">${data.orderId}</span></p>
                        <p class="flex items-center gap-2"><i class="fa-solid fa-user text-zinc-500 w-4"></i><span>User:</span> ${data.username}</p>
                        <p class="flex items-center gap-2"><i class="fa-solid fa-wallet text-emerald-600 w-4"></i><span>Total Rp:</span> <strong class="text-emerald-700 font-mono">Rp ${(data.amount || 0).toLocaleString('id-ID')}</strong></p>
                        <p class="flex items-center gap-2"><i class="fa-solid fa-box text-zinc-500 w-4"></i><span>Paket:</span> ${data.item || '-'}</p>
                        <p class="flex items-center gap-2"><i class="fa-solid fa-clock text-zinc-500 w-4"></i><span>Qty / Hari:</span> <strong class="text-amber-900 font-mono">${durationDays} Hari</strong></p>
                    </div>
                `,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '⚡ LUNASKAN SEKARANG',
                cancelButtonText: 'Tutup',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#6b7280',
                customClass: { popup: 'brutal-border rounded-2xl' }
            }).then((result) => {
                if (result.isConfirmed) {
                    approveTransaction(data.orderId);
                }
            });
        }

        async function loadTransactions(isInitial = false) {
            try {
                const res = await fetch('/api/admin/transactions');
                const result = await res.json();
                allTransactions = result.data || [];

                allTransactions.forEach(trx => {
                    if (trx.proofImage && (trx.status === 'waiting_confirmation' || trx.status === 'pending')) {
                        if (!knownProofOrders.has(trx.orderId)) {
                            knownProofOrders.add(trx.orderId);
                            if (!isInitial) {
                                triggerChromeNotification({
                                    orderId: trx.orderId,
                                    username: trx.username,
                                    amount: trx.amount,
                                    item: trx.itemDetails?.nama || trx.item || '-',
                                    qty: trx.itemDetails?.qty || trx.qty || 1
                                });
                            }
                        }
                    }
                });

                renderTransactions();
            } catch (err) {
                console.error("Gagal memuat transaksi:", err);
            }
        }

        function renderTransactions() {
            const grid = document.getElementById('transactionGrid');

            const filteredData = allTransactions.filter(trx => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'success') return trx.status === 'success';
                if (currentFilter === 'waiting') return trx.status === 'waiting_confirmation' || trx.status === 'pending';
                if (currentFilter === 'reject') return trx.status === 'reject' || trx.status === 'cancelled' || trx.status === 'cancel' || trx.status === 'rejected';
                return true;
            });

            if (filteredData.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 font-bold text-zinc-500">Tidak ada transaksi dengan status (${currentFilter.toUpperCase()}).</div>`;
                return;
            }

            grid.innerHTML = filteredData.map(trx => {
                const statusColor = trx.status === 'success' ? 'bg-emerald-300' : 
                                  (trx.status === 'waiting_confirmation' || trx.status === 'pending') ? 'bg-amber-300 animate-pulse' : 
                                  'bg-red-300';

                const rawQty = trx.itemDetails?.qty || trx.qty || 1;
                const durationText = `${rawQty} Hari`;

                return `
                    <div class="bg-white border-2 brutal-border p-4 rounded-2xl shadow-xs flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex items-center justify-between border-b-2 border-zinc-200 pb-2 mb-3">
                                <span class="font-mono font-black text-xs flex items-center gap-1">
                                    <i class="fa-solid fa-receipt text-zinc-500"></i> ${trx.orderId}
                                </span>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase border-2 brutal-border ${statusColor}">${trx.status}</span>
                            </div>

                            <div class="text-xs space-y-2 font-bold">
                                <p class="flex items-center gap-2">
                                    <i class="fa-solid fa-user text-zinc-500 w-4 text-center"></i>
                                    <span class="text-zinc-500 shrink-0">User:</span>
                                    <span class="truncate">${trx.username} (${trx.email || '-'})</span>
                                </p>
                                <p class="flex items-center gap-2">
                                    <i class="fa-solid fa-wallet text-emerald-600 w-4 text-center"></i>
                                    <span class="text-zinc-500 shrink-0">Total Harga:</span>
                                    <strong class="text-emerald-700 font-mono">Rp ${(trx.amount || 0).toLocaleString('id-ID')}</strong>
                                </p>
                                <p class="flex items-center gap-2">
                                    <i class="fa-solid fa-box text-zinc-500 w-4 text-center"></i>
                                    <span class="text-zinc-500 shrink-0">Paket:</span>
                                    <span>${trx.itemDetails?.nama || trx.item || '-'}</span>
                                </p>
                                <p class="flex items-center gap-2">
                                    <i class="fa-solid fa-clock text-zinc-500 w-4 text-center"></i>
                                    <span class="text-zinc-500 shrink-0">Qty / Hari:</span>
                                    <span class="text-amber-900 font-extrabold font-mono">${durationText}</span>
                                </p>
                                <p class="flex items-center gap-2">
                                    <i class="fa-solid fa-file-invoice text-zinc-500 w-4 text-center"></i>
                                    <span class="text-zinc-500 shrink-0">Bukti:</span>
                                    ${trx.proofImage ? '<span class="text-emerald-600 font-black">TERUNGGAH</span>' : '<span class="text-red-500 font-black">BELUM ADA</span>'}
                                </p>
                            </div>

                            ${trx.proofImage ? `
                                <div class="mt-3 pt-2 border-t border-dashed border-zinc-200">
                                    <button onclick="viewProofImage('${trx.proofImage}')" class="w-full bg-amber-100 hover:bg-amber-200 text-zinc-900 font-black text-[11px] py-1.5 px-3 rounded-lg border-2 brutal-border flex items-center justify-center gap-1.5 transition-all active:scale-95">
                                        <i class="fa-solid fa-image"></i>
                                        <span>LIHAT BUKTI TRANSFER</span>
                                    </button>
                                </div>
                            ` : ''}
                        </div>

                        ${trx.status === 'waiting_confirmation' || trx.status === 'pending' ? `
                            <div class="flex gap-2 pt-2 border-t-2 border-zinc-200">
                                <button onclick="approveTransaction('${trx.orderId}')" class="flex-1 bg-emerald-400 font-black text-xs py-2 rounded-xl border-2 brutal-border uppercase active:scale-95 flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-check"></i> LUNAS
                                </button>
                                <button onclick="rejectTransaction('${trx.orderId}')" class="flex-1 bg-red-400 font-black text-xs py-2 rounded-xl border-2 brutal-border uppercase active:scale-95 flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-xmark"></i> TOLAK
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function approveTransaction(orderId) {
            const res = await fetch(`/api/admin/transactions/${orderId}/approve`, { method: 'POST' });
            const data = await res.json();
            Swal.fire("Sukses", data.message, "success");
            loadTransactions();
        }

        async function rejectTransaction(orderId) {
            const res = await fetch(`/api/admin/transactions/${orderId}/reject`, { method: 'POST' });
            const data = await res.json();
            Swal.fire("Tersimpan", data.message, "info");
            loadTransactions();
        }

        let evtSource;
        function connectAdminSSE() {
            if (evtSource) evtSource.close();
            evtSource = new EventSource("/api/admin/events");

            evtSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "NEW_PAYMENT_PROOF") {
                        if (!knownProofOrders.has(data.orderId)) {
                            knownProofOrders.add(data.orderId);
                            triggerChromeNotification(data);
                        }
                        loadTransactions();
                    }
                } catch (e) {}
            };

            evtSource.onerror = function() {
                evtSource.close();
                setTimeout(connectAdminSSE, 4000);
            };
        }

        window.onload = async function() {
            await registerSW();
            updateNotifButtonState();
            await loadTransactions(true);
            connectAdminSSE();
            await syncPushSubscription();

            setInterval(() => {
                loadTransactions(false);
            }, 4000);
        };
    </script>
</body>
</html>
