<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog - ArulzXD API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <style>
        body {
            background-color: #020617;
            font-family: 'Space Grotesk', sans-serif;
            color: #f8fafc;
        }
        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: #0b1329;
            border: 1px solid rgba(6, 182, 212, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 15px rgba(6, 182, 212, 0.05);
            border-radius: 16px;
        }
        .glass-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-16 antialiased">

    <!-- Sticky Navigation Header -->
    <header class="sticky top-0 z-50 bg-[#020617]/80 backdrop-blur-md border-b border-cyan-500/10 px-4 py-3">
        <div class="max-w-3xl mx-auto flex justify-between items-center gap-3">
            <a href="/" class="glass-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-200 hover:text-cyan-400 flex items-center gap-2 transition-all shadow-md">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="/docs" class="glass-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-200 hover:text-cyan-400 flex items-center gap-2 transition-all shadow-md">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span>Documentation</span>
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-3xl mx-auto px-4 mt-8">
        
        <!-- Header Section -->
        <div class="mb-8 text-left">
            <span class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 font-bold text-[10px] tracking-widest uppercase rounded-full mb-3">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> SYSTEM UPDATES
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">Changelog</h1>
            <p class="text-xs sm:text-sm text-slate-400 leading-relaxed font-normal">
                Catatan otomatis mengenai pembaruan protokol, perbaikan bug, dan rilis fitur REST API dari cluster infrastruktur.
            </p>
        </div>

        <!-- Dynamic Changelog Timeline Container -->
        <div class="relative space-y-8" id="changelog-container">
            <div id="loading" class="text-center py-12 font-mono-custom text-xs text-cyan-400 font-bold">
                [ LOADING PROTOCOL DATA... ]
            </div>
        </div>

    </main>

    <script>
        async function loadChangelog() {
            try {
                const res = await fetch('/database/changelog');
                const data = await res.json();
                
                const container = document.getElementById('changelog-container');
                container.innerHTML = '';

                data.forEach((item, index) => {
                    const isLast = index === data.length - 1;
                    const isFeature = item.type.toLowerCase() === 'feature';
                    
                    const dotBg = isFeature ? 'bg-emerald-400' : 'bg-rose-500';
                    const badgeClass = isFeature 
                        ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                        : 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                    const typeLabel = isFeature ? 'FEATURE' : 'BUG FIX';

                    const cardHTML = `
                        <div class="relative pl-9 sm:pl-10">
                            <!-- Timeline Line (Hapus garis pada item terakhir) -->
                            ${!isLast ? '<div class="absolute left-[15px] sm:left-[17px] top-8 bottom-[-32px] w-[2px] bg-gradient-to-b from-cyan-500/40 via-cyan-500/10 to-transparent"></div>' : ''}

                            <!-- Dot Icon Marker -->
                            <div class="absolute left-0 top-1 w-8 h-8 rounded-full border border-cyan-500/30 bg-[#020617] flex items-center justify-center z-10 shadow-lg">
                                <div class="w-2.5 h-2.5 rounded-full ${dotBg} shadow-[0_0_8px_rgba(34,211,238,0.5)]"></div>
                            </div>

                            <!-- Header Version Tag & Date -->
                            <div class="flex items-center gap-2 mb-2 font-mono-custom text-xs">
                                <span class="px-2 py-0.5 border border-cyan-500/30 rounded-md text-[11px] font-bold text-cyan-400 bg-cyan-950/30">${item.version}</span>
                                <span class="text-slate-400 font-medium text-[11px]">${item.date}</span>
                                <span class="text-slate-600">•</span>
                                <span class="px-2 py-0.5 border rounded-md text-[9px] font-extrabold tracking-wider uppercase ${badgeClass}">${typeLabel}</span>
                            </div>

                            <!-- Content Card -->
                            <div class="glass-panel p-5 sm:p-6 transition-all duration-300 hover:border-cyan-500/30">
                                <h2 class="text-base sm:text-lg font-bold text-white mb-2 tracking-wide">${item.title}</h2>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal mb-4">
                                    ${item.description}
                                </p>
                                
                                <hr class="border-white/5 mb-3">

                                <div class="flex justify-between items-center text-[10px] sm:text-[11px] font-mono-custom text-slate-400">
                                    <div class="flex items-center gap-1.5 text-cyan-400 font-semibold">
                                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                        </svg>
                                        <span>PROTOCOL VERIFIED</span>
                                    </div>
                                    ${item.node ? `<span class="opacity-80">NODE: ${item.node}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (err) {
                console.error('Error fetching changelog:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadChangelog);
    </script>
    <script src="/script.js"></script>
</body>
</html>
