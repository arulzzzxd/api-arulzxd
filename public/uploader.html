<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Uploader - ArulzXD REST API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #0b0f19;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 relative overflow-hidden">
        <!-- Glow Effect Header -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Title -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">
                Supabase <span class="text-cyan-400">File Uploader</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">Unggah berkas Anda secara cepat, aman, dan langsung ke Cloud Storage.</p>
        </div>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-5">
            <!-- API Key Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">API Key</label>
                <input type="text" id="apikeyInput" placeholder="Masukkan API Key Anda..." required
                    class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-cyan-500 transition">
            </div>

            <!-- Drag & Drop File Zone -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Pilih File</label>
                <div id="dropZone" class="border-2 border-dashed border-white/15 hover:border-cyan-500/50 bg-slate-900/40 rounded-xl p-6 text-center cursor-pointer transition duration-200 flex flex-col items-center justify-center min-h-[140px]">
                    <svg class="w-10 h-10 text-cyan-400 mb-2 opacity-80" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                    </svg>
                    <p id="fileNameDisplay" class="text-xs text-slate-300 font-medium">Klik atau seret file ke sini</p>
                    <span class="text-[10px] text-slate-500 mt-1">Ukuran Maksimal: 50MB</span>
                    <input type="file" id="fileInput" name="file" class="hidden" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
                <span id="btnText">Unggah Sekarang</span>
                <div id="btnSpinner" class="hidden animate-spin h-4 w-4 border-2 border-slate-950 border-t-transparent rounded-full"></div>
            </button>
        </form>

        <!-- Result Card -->
        <div id="resultCard" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3">
            <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest block">File Berhasil Diunggah</span>
            
            <div class="bg-slate-900/90 border border-white/5 rounded-xl p-3 flex items-center justify-between gap-2">
                <input type="text" id="uploadedUrl" readonly class="bg-transparent text-xs text-slate-200 font-mono w-full focus:outline-none select-all truncate">
                <button onclick="copyResultUrl()" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 text-xs font-bold px-3 py-2 rounded-lg border border-cyan-500/20 transition flex-shrink-0">
                    Salin Link
                </button>
            </div>
        </div>

        <!-- Back Link -->
        <div class="mt-6 text-center">
            <a href="/doc" class="text-xs text-slate-500 hover:text-cyan-400 transition-colors uppercase font-semibold tracking-wider">
                &larr; Kembali ke Dokumentasi
            </a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadForm = document.getElementById('uploadForm');
        const apikeyInput = document.getElementById('apikeyInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultCard = document.getElementById('resultCard');
        const uploadedUrl = document.getElementById('uploadedUrl');

        // Otomatis isi API Key jika user dalam keadaan terautentikasi/login
        fetch('/api/user-status')
            .then(res => res.json())
            .then(data => {
                if (data.loggedIn && data.user.apiKey) {
                    apikeyInput.value = data.user.apiKey;
                }
            }).catch(() => {});

        // Drag & Drop Interactions
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = fileInput.files[0].name;
                fileNameDisplay.classList.add('text-cyan-400', 'font-bold');
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-cyan-500', 'bg-cyan-500/5');
        });

        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, () => {
                dropZone.classList.remove('border-cyan-500', 'bg-cyan-500/5');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-cyan-500', 'bg-cyan-500/5');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileNameDisplay.textContent = e.dataTransfer.files[0].name;
                fileNameDisplay.classList.add('text-cyan-400', 'font-bold');
            }
        });

        // AJAX Form Submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileInput.files.length) {
                return Swal.fire({ icon: 'warning', title: 'Pilih File', text: 'Silakan pilih berkas terlebih dahulu.' });
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('apikey', apikeyInput.value.trim());

            // Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Mengunggah...';
            btnSpinner.classList.remove('hidden');

            try {
                const res = await fetch('/api/tools/arulz-upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.status) {
                    resultCard.classList.remove('hidden');
                    uploadedUrl.value = data.url;
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Berkas berhasil diunggah ke Supabase Storage.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Unggah',
                        text: data.message || 'Terjadi kesalahan saat mengunggah.'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Kesalahan Sistem',
                    text: 'Gagal terhubung ke server.'
                });
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Unggah Sekarang';
                btnSpinner.classList.add('hidden');
            }
        });

        function copyResultUrl() {
            uploadedUrl.select();
            document.execCommand('copy');
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'Link berhasil disalin!',
                showConfirmButton: false,
                timer: 2000
            });
        }
    </script>
</body>
</html>
