<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArulzXD Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        cyberCyan: '#00f3ff',
                        cyberDark: '#050b14',
                        cyberCard: '#0a1628',
                        cyberBorder: '#162a45'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-cyberDark text-slate-100 min-h-screen">

    <nav class="sticky top-0 z-40 bg-cyberDark/90 backdrop-blur-md border-b border-cyberBorder p-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="/" class="text-2xl font-black font-cyber text-cyberCyan">Arulz<span class="text-white">Store</span></a>
            <a href="/doc" class="text-sm font-semibold hover:text-cyberCyan">Docs API</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-black font-cyber text-white mb-6">Store <span class="text-cyberCyan">Casaku + MongoDB</span></h1>
        
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- MODAL POPUP CHECKOUT -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cyberCard w-full max-w-md rounded-2xl border border-cyberCyan/40 p-5 relative">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- STEP 1: FORM PEMBELIAN -->
            <form id="orderForm" onsubmit="processCasakuPay(event)" class="space-y-4">
                <h3 class="font-bold text-sm font-cyber text-cyberCyan flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Checkout Pembayaran
                </h3>

                <div class="bg-cyberDark p-3 rounded-xl border border-cyberBorder flex items-center gap-3">
                    <img id="modalProductImg" src="" class="w-12 h-12 rounded object-cover">
                    <div>
                        <p id="modalProductName" class="text-xs font-bold text-white"></p>
                        <p id="modalProductPrice" class="text-xs font-bold text-cyberCyan"></p>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">Username Pembeli:</label>
                    <input type="text" id="usernameInput" required placeholder="Masukkan nama/username Anda" class="w-full bg-cyberDark border border-cyberBorder rounded-lg p-2 text-xs focus:outline-none focus:border-cyberCyan text-white">
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-cyberCyan hover:bg-cyan-300 text-cyberDark font-cyber font-bold py-2.5 rounded-xl text-xs transition">
                    Bayar Otomatis via QRIS Casaku
                </button>
            </form>

            <!-- STEP 2: DISPLAY QRIS DINAMIS -->
            <div id="qrisSection" class="hidden text-center space-y-4 py-2">
                <h3 class="font-bold text-sm font-cyber text-cyberCyan">Scan QRIS Untuk Membayar</h3>
                
                <div class="bg-white p-3 rounded-xl inline-block shadow-lg">
                    <img id="qrisImage" src="" alt="QRIS Code" class="w-48 h-48 mx-auto object-contain">
                </div>

                <p class="text-xs text-slate-300">Total Tagihan: <strong id="qrisAmount" class="text-cyberCyan font-cyber">Rp 0</strong></p>
                
                <div id="statusBadge" class="text-xs font-mono text-amber-400 animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin"></i> Menunggu pembayaran terdeteksi di MongoDB...
                </div>

                <!-- STEP 3: HASIL LINK PRODUK (Selesai) -->
                <div id="successResult" class="hidden bg-emerald-950/80 border border-emerald-500/50 p-4 rounded-xl text-left space-y-2">
                    <div class="flex items-center gap-2 text-emerald-400 font-bold text-xs font-cyber">
                        <i class="fa-solid fa-circle-check"></i> PEMBAYARAN SUKSES!
                    </div>
                    <p class="text-[11px] text-slate-300">Transaksi terverifikasi. Klik tombol di bawah untuk mengakses produk:</p>
                    
                    <a id="downloadLinkBtn" href="#" target="_blank" class="block text-center w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold font-cyber py-2 rounded-lg text-xs transition shadow-lg">
                        <i class="fa-solid fa-download"></i> Buka Link Produk / Download
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        let DATA_PRODUK = [];
        let SELECTED_INDEX = null;
        let pollingTimer = null;

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        async function loadProduk() {
            try {
                const res = await fetch('/database/produk');
                DATA_PRODUK = await res.json();
                
                const grid = document.getElementById('productGrid');
                grid.innerHTML = DATA_PRODUK.map((item, idx) => `
                    <div class="bg-cyberCard border border-cyberBorder rounded-xl p-3 flex flex-col justify-between">
                        <img src="${item.gambar || 'https://arulz-xd.my.id/files/X1F0Cn.png'}" class="w-full h-36 object-cover rounded-lg mb-2">
                        <h4 class="text-xs font-bold text-white mb-1">${item.nama}</h4>
                        <p class="text-cyberCyan font-cyber font-bold text-xs mb-3">${formatRupiah(item.harga_diskon || item.harga)}</p>
                        <button onclick="openModal(${idx})" class="w-full bg-cyberCyan/10 hover:bg-cyberCyan border border-cyberCyan/40 text-cyberCyan hover:text-cyberDark font-bold py-2 rounded-lg text-xs font-cyber transition">
                            Beli Otomatis
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading products:", err);
            }
        }

        function openModal(idx) {
            SELECTED_INDEX = idx;
            const item = DATA_PRODUK[idx];
            document.getElementById('modalProductName').innerText = item.nama;
            document.getElementById('modalProductPrice').innerText = formatRupiah(item.harga_diskon || item.harga);
            document.getElementById('modalProductImg').src = item.gambar || 'https://arulz-xd.my.id/files/X1F0Cn.png';

            document.getElementById('orderForm').classList.remove('hidden');
            document.getElementById('qrisSection').classList.add('hidden');
            document.getElementById('successResult').classList.add('hidden');
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        async function processCasakuPay(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value;
            const btn = document.getElementById('btnSubmit');

            btn.disabled = true;
            btn.innerText = "Memproses QRIS MongoDB...";

            try {
                const response = await fetch('/api/store/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        produkIndex: SELECTED_INDEX,
                        qty: 1,
                        username: username
                    })
                });

                const data = await response.json();
                if (!data.status) throw new Error(data.message);

                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('qrisSection').classList.remove('hidden');

                const qrUrl = data.qrString.startsWith('http') 
                    ? data.qrString 
                    : `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(data.qrString)}`;

                document.getElementById('qrisImage').src = qrUrl;
                document.getElementById('qrisAmount').innerText = formatRupiah(data.amount);

                // Polling Pengecekan Status ke MongoDB
                startPolling(data.orderId);

            } catch (err) {
                alert("Gagal: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Bayar Otomatis via QRIS Casaku";
            }
        }

        function startPolling(orderId) {
            if (pollingTimer) clearInterval(pollingTimer);

            pollingTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/store/check-status/${orderId}`);
                    const data = await res.json();

                    if (data.status && data.paid) {
                        clearInterval(pollingTimer);
                        document.getElementById('statusBadge').classList.add('hidden');
                        document.getElementById('successResult').classList.remove('hidden');
                        
                        // Set Link Produk
                        document.getElementById('downloadLinkBtn').href = data.linkProduk;
                    }
                } catch (e) {
                    console.log("Polling error:", e);
                }
            }, 3000); // Polling setiap 3 detik
        }

        function closeModal() {
            if (pollingTimer) clearInterval(pollingTimer);
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', loadProduk);
    </script>
</body>
</html>
